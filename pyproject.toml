[project]
name = "ai-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "VPatil3155", email = "patilvaibhav8197@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.14",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]

[project.scripts]
ai-system = "ai_system:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]